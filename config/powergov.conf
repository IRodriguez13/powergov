# powergov persistent configuration
# USER_MODE: max-battery | balanced | performance | custom
# FEATURES: comma-separated subsystem list (governor,epp,freq_cap,turbo,platform,runtime_pm)
# BATTERY_SAFE_THRESHOLD: 0 disables; 1-100 blocks performance governor below threshold
# DEV_LOG: 1 enables developer log at /var/log/powergov/powergov.log
USER_MODE=max-battery
FEATURES=governor,epp,freq_cap,turbo,platform,runtime_pm,peripheral_pm,disk_pm,pcie_aspm,bluetooth_pm
BATTERY_SAFE_THRESHOLD=0
LOG_LEVEL=3
DEV_LOG=1
THRESHOLD_LOW=0.25
THRESHOLD_MID=0.60
THRESHOLD_HIGH=0.75
FREQ_CAP_BATTERY=80
LOW_BATTERY=15
